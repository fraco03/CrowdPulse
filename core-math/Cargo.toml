[package]
name = "crowdpulse-math"
version = "0.1.0"
edition = "2021"
authors = ["CrowdPulse Team"]
description = "High performance Kinematic Trilateration and Sensor Fusion Kalman Filter engine for peer-to-peer localization"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = { version = "0.21", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
approx = "0.5"
